<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diário — Grupo Alard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root { --bg:#0d0d0d; --surface:#161616; --accent:#e2231a; --accent-dim:#7a1512;
    --text:#eef0ee; --text-dim:#9aa39d; --border:#2a2a2a;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  *,*::before,*::after{box-sizing:inherit}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Poppins',-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}

  /* --- Login --- */
  #loginScreen{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
  .box{width:100%;max-width:360px}
  .badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--accent);background:rgba(226,35,26,.1);border:1px solid var(--accent-dim);border-radius:999px;padding:5px 12px;margin-bottom:14px}
  h1{margin:0 0 6px;font-size:24px;font-weight:800}
  .sub{color:var(--text-dim);font-size:13.5px;margin-bottom:24px}
  label{display:block;font-size:12px;color:var(--text-dim);margin:14px 0 6px;font-family:'IBM Plex Mono',monospace}
  input,textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--text);font-size:14.5px;font-family:inherit;outline:none}
  input:focus,textarea:focus{border-color:var(--accent)}
  .btn{padding:13px;border-radius:9px;font-size:15px;font-weight:700;border:none;cursor:pointer;font-family:inherit;background:var(--accent);color:#fff}
  .btn:disabled{opacity:.5;cursor:default}
  .msg{margin-top:14px;font-size:13px;padding:10px 12px;border-radius:8px;display:none}
  .msg.error{display:block;background:rgba(226,35,26,.12);color:#ff6b63;border:1px solid var(--accent-dim)}

  /* --- App --- */
  #appScreen{display:none;max-width:560px;margin:0 auto;min-height:100%}
  header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:20px 16px 12px;border-bottom:1px solid var(--border);z-index:5}
  .top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-dim)}
  .who .dot{width:9px;height:9px;border-radius:50%}
  .logout-link{font-size:12px;color:var(--text-dim);background:none;border:none;cursor:pointer;text-decoration:underline;font-family:inherit}
  .search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
  .search input{flex:1;background:none;border:none;padding:0}
  main{padding:14px 16px 100px}
  .empty{color:var(--text-dim);text-align:center;padding:48px 20px;font-size:14px;line-height:1.6}
  .entry{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px}
  .entry-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px}
  .entry-author{font-weight:600;font-size:14px}
  .entry-meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);white-space:nowrap}
  .entry-client{display:inline-block;font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--accent);background:rgba(226,35,26,.1);border:1px solid var(--accent-dim);border-radius:5px;padding:2px 7px;margin-bottom:8px}
  .entry-text{font-size:14.5px;line-height:1.55;white-space:pre-wrap}
  .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--accent);color:#fff;border:none;border-radius:999px;padding:14px 22px;font-size:15px;font-weight:700;font-family:inherit;max-width:calc(560px - 32px);width:calc(100% - 32px);cursor:pointer}
  .sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10;display:none;align-items:flex-end;justify-content:center}
  .sheet-backdrop.open{display:flex}
  .sheet{background:var(--bg);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border)}
  .sheet h2{font-size:16px;margin:0 0 14px}
  textarea{resize:vertical;min-height:80px;line-height:1.5}
  .sheet-actions{display:flex;gap:10px;margin-top:18px}
  .btn-cancel{flex:1;background:var(--surface);color:var(--text-dim);padding:12px;border-radius:9px;border:none;font-weight:700;cursor:pointer;font-family:inherit}
  .btn-save{flex:1}
  .loading{text-align:center;color:var(--text-dim);padding:40px;font-size:13px}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="box">
    <div class="badge">GRUPO ALARD</div>
    <h1>Entrar</h1>
    <div class="sub">Diário da equipe</div>
    <label>E-mail</label>
    <input id="email" type="email" placeholder="seu@email.com" autocomplete="username">
    <label>Senha</label>
    <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
    <button class="btn" id="loginBtn" style="width:100%;margin-top:22px">Entrar</button>
    <div class="msg" id="loginMsg"></div>
  </div>
</div>

<div id="appScreen">
  <header>
    <div class="top-row">
      <div class="who"><span class="dot" id="whoDot"></span><span id="whoName"></span></div>
      <button class="logout-link" id="logoutBtn">Sair</button>
    </div>
    <div class="badge">DIÁRIO</div>
    <h1 style="font-size:22px">Anotações da equipe</h1>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="Buscar por nome, cliente, palavra...">
    </div>
  </header>
  <main id="list"><div class="loading">Carregando...</div></main>
  <button class="fab" id="openNew">+ Nova anotação</button>
</div>

<div class="sheet-backdrop" id="backdrop">
  <div class="sheet">
    <h2>Nova anotação</h2>
    <label>Cliente (opcional)</label>
    <input id="client" type="text" placeholder="Ex: Paulo Ferreira">
    <label>Anotação</label>
    <textarea id="text" placeholder="O que aconteceu hoje..."></textarea>
    <div class="msg" id="formMsg"></div>
    <div class="sheet-actions">
      <button class="btn-cancel" id="cancelBtn">Cancelar</button>
      <button class="btn btn-save" id="saveBtn">Salvar</button>
    </div>
  </div>
</div>

<script>
  const sb = supabase.createClient(
    'https://ophydiyzvbvilhkmcwuh.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9waHlkaXl6dmJ2aWxoa21jd3VoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyOTg0OTgsImV4cCI6MjEwNTg3NDQ5OH0.roXYCaGC5E8rDQtHNH7vqYj_kqagno30roDNZsByiMc'
  );

  let currentProfile = null;

  function showMsg(el, text) { el.textContent = text; el.classList.add('error'); el.style.display = 'block'; }

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const msg = document.getElementById('loginMsg');
    if (!email || !password) { showMsg(msg, 'Preencha e-mail e senha.'); return; }
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { showMsg(msg, 'Erro: ' + error.message); return; }
    await enterApp(data.user.id);
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await sb.auth.signOut();
    document.getElementById('appScreen').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
  });

  async function enterApp(userId) {
    const { data: profile, error } = await sb.from('profiles').select('*').eq('id', userId).single();
    if (error || !profile) { showMsg(document.getElementById('loginMsg'), 'Perfil não encontrado. Confirme o cadastro em profiles.'); return; }
    currentProfile = profile;
    document.getElementById('whoName').textContent = profile.name;
    document.getElementById('whoDot').style.background = profile.color || '#666';
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appScreen').style.display = 'block';
    loadEntries();
  }

  function highlight(str, term) {
    if (!term) return str;
    const esc = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return str.replace(new RegExp('(' + esc + ')', 'ig'), '<mark style="background:var(--accent);color:#fff;border-radius:3px">$1</mark>');
  }

  function fmtDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit' }) + ' · ' + d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
  }

  async function loadEntries() {
    const term = document.getElementById('searchInput').value.trim();
    const listEl = document.getElementById('list');
    listEl.innerHTML = '<div class="loading">Carregando...</div>';

    let query = sb.from('diary_entries').select('*, profiles(name)').order('created_at', { ascending: false });
    if (term) query = query.or(`text.ilike.%${term}%,client_name.ilike.%${term}%`);

    const { data, error } = await query;
    if (error) { listEl.innerHTML = `<div class="empty">Erro ao carregar: ${error.message}</div>`; return; }
    if (!data || data.length === 0) { listEl.innerHTML = '<div class="empty">Nenhuma anotação encontrada.</div>'; return; }

    listEl.innerHTML = data.map(e => `
      <div class="entry">
        <div class="entry-top">
          <span class="entry-author">${highlight(e.profiles?.name || 'Desconhecido', term)}</span>
          <span class="entry-meta">${fmtDate(e.created_at)}</span>
        </div>
        ${e.client_name ? `<span class="entry-client">${highlight(e.client_name, term)}</span>` : ''}
        <div class="entry-text">${highlight(e.text, term)}</div>
      </div>
    `).join('');
  }

  let searchTimer;
  document.getElementById('searchInput').addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(loadEntries, 300);
  });

  const backdrop = document.getElementById('backdrop');
  document.getElementById('openNew').addEventListener('click', () => {
    document.getElementById('client').value = '';
    document.getElementById('text').value = '';
    document.getElementById('formMsg').style.display = 'none';
    backdrop.classList.add('open');
  });
  document.getElementById('cancelBtn').addEventListener('click', () => backdrop.classList.remove('open'));
  backdrop.addEventListener('click', e => { if (e.target === backdrop) backdrop.classList.remove('open'); });

  document.getElementById('saveBtn').addEventListener('click', async () => {
    const text = document.getElementById('text').value.trim();
    const client_name = document.getElementById('client').value.trim();
    const formMsg = document.getElementById('formMsg');
    if (!text) { showMsg(formMsg, 'Escreva algo na anotação.'); return; }
    const { error } = await sb.from('diary_entries').insert({ author_id: currentProfile.id, client_name: client_name || null, text });
    if (error) { showMsg(formMsg, 'Erro ao salvar: ' + error.message); return; }
    backdrop.classList.remove('open');
    document.getElementById('searchInput').value = '';
    loadEntries();
  });

  // Se já tiver sessão ativa, entra direto
  sb.auth.getSession().then(({ data }) => {
    if (data.session) enterApp(data.session.user.id);
  });
</script>
</body>
</html>
