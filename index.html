<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alard-Tec</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0d0d0d; --surface:#161616; --accent:#e2231a; --accent-dim:#7a1512; --text:#eef0ee; --text-dim:#9aa39d; --border:#2a2a2a;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  *,*::before,*::after{box-sizing:inherit}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Poppins',-apple-system,Segoe UI,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
  .wrap{max-width:400px;width:100%;text-align:center}
  .badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--accent);background:rgba(226,35,26,.1);border:1px solid var(--accent-dim);border-radius:999px;padding:5px 14px;margin-bottom:14px}
  h1{margin:0 0 30px;font-size:26px;font-weight:800}
  .card{display:block;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:12px;text-decoration:none;color:var(--text);text-align:left;transition:border-color .15s}
  .card:hover{border-color:var(--accent-dim)}
  .card .t{font-size:16px;font-weight:700;margin-bottom:3px}
  .card .s{font-size:12.5px;color:var(--text-dim)}
</style>
</head>
<body>
<div class="wrap">
  <div class="badge">ALARD-TEC</div>
  <h1>Assistente da Equipe</h1>
  <a class="card" href="diario.html"><div class="t">📓 Diário</div><div class="s">Anotações do dia a dia, buscáveis por cliente</div></a>
  <a class="card" href="wiki.html"><div class="t">📘 Wiki de Procedimentos</div><div class="s">Passo a passo pra tirar dúvidas em campo</div></a>
  <a class="card" href="agenda.html"><div class="t">📅 Agenda</div><div class="s">Compromissos com prioridade e confirmação</div></a>
</div>
</body>
</html>
