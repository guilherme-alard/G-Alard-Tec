<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alard-Tec</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0d0d0d; --surface:#161616; --accent:#e2231a; --accent-dim:#7a1512; --text:#eef0ee; --text-dim:#9aa39d; --border:#2a2a2a;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  *,*::before,*::after{box-sizing:inherit}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Poppins',-apple-system,Segoe UI,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
  .wrap{max-width:400px;width:100%;text-align:center}
  .badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--accent);background:rgba(226,35,26,.1);border:1px solid var(--accent-dim);border-radius:999px;padding:5px 14px;margin-bottom:14px}
  h1{margin:0 0 30px;font-size:26px;font-weight:800}
  .card{display:block;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:12px;text-decoration:none;color:var(--text);text-align:left;transition:border-color .15s}
  .card:hover{border-color:var(--accent-dim)}
  .card .t{font-size:16px;font-weight:700;margin-bottom:3px}
  .card .s{font-size:12.5px;color:var(--text-dim)}
  .verse{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin:0 0 22px;text-align:left}
  .verse .lbl{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--accent);margin-bottom:10px}
  .verse .txt{font-size:15.5px;line-height:1.6;margin:0;font-style:italic}
  .verse .ref{margin-top:10px;font-size:12.5px;font-weight:700;color:var(--text-dim)}
</style>
</head>
<body>
<div class="wrap">
  <div class="badge">ALARD-TEC</div>
  <h1>Assistente da Equipe</h1>
  <div class="verse" id="verse"><div class="lbl">VERSÍCULO DO DIA</div><p class="txt" id="verseTxt"></p><div class="ref" id="verseRef"></div></div>
  <a class="card" href="diario.html"><div class="t">📓 Diário</div><div class="s">Anotações do dia a dia, buscáveis por cliente</div></a>
  <a class="card" href="wiki.html"><div class="t">📘 Wiki de Procedimentos</div><div class="s">Passo a passo pra tirar dúvidas em campo</div></a>
  <a class="card" href="agenda.html"><div class="t">📅 Agenda</div><div class="s">Compromissos com prioridade e confirmação</div></a>
</div>
<script>
  // Versículos (tradução Almeida). Um por dia, na mesma ordem para toda a equipe.
  const VERSOS = [["Josué 1:9", "Não to mandei eu? Esforça-te e tem bom ânimo; não temas, nem te espantes, porque o Senhor, teu Deus, é contigo por onde quer que andares."], ["Salmos 23:1", "O Senhor é o meu pastor; nada me faltará."], ["Isaías 41:10", "Não temas, porque eu sou contigo; não te assombres, porque eu sou teu Deus; eu te fortaleço, e te ajudo, e te sustento com a destra da minha justiça."], ["Filipenses 4:13", "Posso todas as coisas naquele que me fortalece."], ["Provérbios 3:5-6", "Confia no Senhor de todo o teu coração e não te estribes no teu próprio entendimento. Reconhece-o em todos os teus caminhos, e ele endireitará as tuas veredas."], ["Jeremias 29:11", "Porque eu bem sei os pensamentos que penso de vós, diz o Senhor; pensamentos de paz e não de mal, para vos dar o fim que esperais."], ["Romanos 8:28", "E sabemos que todas as coisas contribuem juntamente para o bem daqueles que amam a Deus."], ["Salmos 46:1", "Deus é o nosso refúgio e fortaleza, socorro bem presente na angústia."], ["Isaías 40:31", "Mas os que esperam no Senhor renovarão as suas forças; subirão com asas como águias; correrão e não se cansarão; caminharão e não se fatigarão."], ["Mateus 11:28", "Vinde a mim, todos os que estais cansados e oprimidos, e eu vos aliviarei."], ["Salmos 37:5", "Entrega o teu caminho ao Senhor; confia nele, e ele tudo fará."], ["Lamentações 3:22-23", "As misericórdias do Senhor são a causa de não sermos consumidos, porque as suas misericórdias não têm fim; novas são cada manhã; grande é a tua fidelidade."], ["Salmos 121:1-2", "Elevo os meus olhos para os montes: de onde me virá o socorro? O meu socorro vem do Senhor, que fez o céu e a terra."], ["1 Pedro 5:7", "Lançando sobre ele toda a vossa ansiedade, porque ele tem cuidado de vós."], ["Filipenses 4:6-7", "Não estejais inquietos por coisa alguma; antes, as vossas petições sejam em tudo conhecidas diante de Deus, pela oração e súplica, com ação de graças. E a paz de Deus, que excede todo o entendimento, guardará os vossos corações."], ["Salmos 27:1", "O Senhor é a minha luz e a minha salvação; a quem temerei? O Senhor é a força da minha vida; de quem me recearei?"], ["Colossenses 3:23", "E, tudo quanto fizerdes, fazei-o de todo o coração, como ao Senhor e não aos homens."], ["Salmos 118:24", "Este é o dia que fez o Senhor; regozijemo-nos e alegremo-nos nele."], ["Isaías 26:3", "Tu conservarás em paz aquele cuja mente está firme em ti, porque ele confia em ti."], ["Romanos 15:13", "Ora, o Deus de esperança vos encha de todo o gozo e paz em crença, para que abundeis em esperança pela virtude do Espírito Santo."], ["Salmos 55:22", "Lança o teu cuidado sobre o Senhor, e ele te susterá."], ["Deuteronômio 31:8", "O Senhor, pois, é aquele que vai adiante de ti; ele será contigo, não te deixará, nem te desamparará; não temas, nem te espantes."], ["Salmos 91:1-2", "Aquele que habita no esconderijo do Altíssimo, à sombra do Onipotente descansará. Direi do Senhor: Ele é o meu Deus, o meu refúgio, a minha fortaleza, e nele confiarei."], ["2 Coríntios 12:9", "A minha graça te basta, porque o meu poder se aperfeiçoa na fraqueza."], ["Gálatas 6:9", "E não nos cansemos de fazer o bem, porque a seu tempo ceifaremos, se não houvermos desfalecido."], ["Salmos 34:8", "Provai e vede que o Senhor é bom; bem-aventurado o homem que nele confia."], ["João 14:27", "Deixo-vos a paz, a minha paz vos dou; não vo-la dou como o mundo a dá. Não se turbe o vosso coração, nem se atemorize."], ["Hebreus 11:1", "Ora, a fé é o firme fundamento das coisas que se esperam e a prova das coisas que se não veem."], ["Salmos 16:8", "Tenho posto o Senhor continuamente diante de mim; por isso que ele está à minha mão direita, nunca vacilarei."], ["Provérbios 16:3", "Confia ao Senhor as tuas obras, e teus pensamentos serão estabelecidos."], ["Mateus 6:33", "Mas buscai primeiro o Reino de Deus, e a sua justiça, e todas essas coisas vos serão acrescentadas."], ["Salmos 30:5", "O choro pode durar uma noite, mas a alegria vem pela manhã."], ["Isaías 43:2", "Quando passares pelas águas, estarei contigo, e, quando pelos rios, eles não te submergirão."], ["Romanos 8:31", "Se Deus é por nós, quem será contra nós?"], ["Salmos 62:1-2", "A minha alma espera somente em Deus; dele vem a minha salvação. Só ele é a minha rocha e a minha salvação."], ["Tiago 1:5", "E, se algum de vós tem falta de sabedoria, peça-a a Deus, que a todos dá liberalmente e o não lança em rosto, e ser-lhe-á dada."], ["Naum 1:7", "O Senhor é bom, ele serve de fortaleza no dia da angústia e conhece os que confiam nele."], ["Salmos 28:7", "O Senhor é a minha força e o meu escudo; nele confiou o meu coração, e fui socorrido."], ["2 Timóteo 1:7", "Porque Deus não nos deu o espírito de temor, mas de fortaleza, e de amor, e de moderação."], ["Isaías 12:2", "Eis que Deus é a minha salvação; eu confiarei e não temerei, porque o Senhor é a minha força e o meu cântico."], ["Salmos 32:8", "Instruir-te-ei e ensinar-te-ei o caminho que deves seguir; guiar-te-ei com os meus olhos."], ["Miqueias 7:7", "Eu, porém, esperarei no Senhor; esperarei no Deus da minha salvação; o meu Deus me ouvirá."], ["Salmos 145:18", "Perto está o Senhor de todos os que o invocam, de todos os que o invocam em verdade."], ["Hebreus 13:5", "Não te deixarei, nem te desampararei."], ["Sofonias 3:17", "O Senhor, teu Deus, está no meio de ti, poderoso para te salvar."], ["Salmos 138:8", "O Senhor aperfeiçoará o que me concerne."], ["Provérbios 18:10", "Torre forte é o nome do Senhor; a ela correrá o justo e estará em alto refúgio."], ["Êxodo 14:14", "O Senhor pelejará por vós, e vós vos calareis."], ["Salmos 9:10", "Em ti confiarão os que conhecem o teu nome; porque tu, Senhor, nunca desamparaste os que te buscam."], ["1 Coríntios 15:58", "Portanto, meus amados irmãos, sede firmes e constantes, sempre abundantes na obra do Senhor, sabendo que o vosso trabalho não é vão no Senhor."], ["Salmos 73:26", "A minha carne e o meu coração desfalecem; mas Deus é a fortaleza do meu coração e a minha porção para sempre."], ["Isaías 54:10", "Porque as montanhas se retirarão, e os outeiros serão abalados; porém a minha benignidade não se apartará de ti."], ["Salmos 4:8", "Em paz também me deitarei e dormirei, porque só tu, Senhor, me fazes habitar em segurança."], ["João 16:33", "No mundo tereis aflições, mas tende bom ânimo; eu venci o mundo."], ["Salmos 40:1", "Esperei com paciência no Senhor, e ele se inclinou para mim e ouviu o meu clamor."], ["Romanos 12:12", "Alegrai-vos na esperança, sede pacientes na tribulação, perseverai na oração."], ["Salmos 94:19", "Multiplicando-se dentro de mim os meus cuidados, as tuas consolações recrearam a minha alma."], ["Filipenses 1:6", "Tendo por certo isto mesmo: que aquele que em vós começou a boa obra a aperfeiçoará."], ["Salmos 90:17", "E seja sobre nós a graça do Senhor, nosso Deus; e confirma sobre nós a obra das nossas mãos."], ["Provérbios 16:9", "O coração do homem considera o seu caminho, mas o Senhor lhe dirige os passos."]];
  const hoje = new Date();
  const dia = Math.floor(Date.UTC(hoje.getFullYear(), hoje.getMonth(), hoje.getDate()) / 86400000);
  const [ref, txt] = VERSOS[dia % VERSOS.length];
  document.getElementById('verseTxt').textContent = '“' + txt + '”';
  document.getElementById('verseRef').textContent = ref;
</script>
</body>
</html>
