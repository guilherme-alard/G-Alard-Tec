<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wiki — Grupo Alard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root { --bg:#0d0d0d; --surface:#161616; --accent:#e2231a; --accent-dim:#7a1512;
    --text:#eef0ee; --text-dim:#9aa39d; --border:#2a2a2a;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  *,*::before,*::after{box-sizing:inherit}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Poppins',-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}

  #loginScreen{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
  .box{width:100%;max-width:360px}
  .badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--accent);background:rgba(226,35,26,.1);border:1px solid var(--accent-dim);border-radius:999px;padding:5px 12px;margin-bottom:14px}
  h1{margin:0 0 6px;font-size:24px;font-weight:800}
  .sub{color:var(--text-dim);font-size:13.5px;margin-bottom:24px}
  label{display:block;font-size:12px;color:var(--text-dim);margin:14px 0 6px;font-family:'IBM Plex Mono',monospace}
  input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--text);font-size:14.5px;font-family:inherit;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  .btn{padding:13px;border-radius:9px;font-size:15px;font-weight:700;border:none;cursor:pointer;font-family:inherit;background:var(--accent);color:#fff}
  .btn:disabled{opacity:.5;cursor:default}
  .msg{margin-top:14px;font-size:13px;padding:10px 12px;border-radius:8px;display:none}
  .msg.error{display:block;background:rgba(226,35,26,.12);color:#ff6b63;border:1px solid var(--accent-dim)}

  #appScreen{display:none;max-width:560px;margin:0 auto;min-height:100%}
  header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:20px 16px 12px;border-bottom:1px solid var(--border);z-index:5}
  .top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-dim)}
  .who .dot{width:9px;height:9px;border-radius:50%}
  .logout-link{font-size:12px;color:var(--text-dim);background:none;border:none;cursor:pointer;text-decoration:underline;font-family:inherit}
  .search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
  .search input{flex:1;background:none;border:none;padding:0}
  .tags{display:flex;gap:8px;margin-top:12px;overflow-x:auto;padding-bottom:2px}
  .tag{flex-shrink:0;font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--border);color:var(--text-dim);background:var(--surface);cursor:pointer;white-space:nowrap}
  .tag.active{color:var(--accent);border-color:var(--accent-dim);background:rgba(226,35,26,.1)}
  main{padding:14px 16px 100px}
  .empty{color:var(--text-dim);text-align:center;padding:48px 20px;font-size:14px;line-height:1.6}
  .loading{text-align:center;color:var(--text-dim);padding:40px;font-size:13px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px;cursor:pointer}
  .card-cat{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--accent);margin-bottom:6px;font-family:'IBM Plex Mono',monospace}
  .card-title{font-size:16px;font-weight:700;margin-bottom:4px}
  .card-steps{font-size:12.5px;color:var(--text-dim)}
  .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--accent);color:#fff;border:none;border-radius:999px;padding:14px 22px;font-size:15px;font-weight:700;font-family:inherit;max-width:calc(560px - 32px);width:calc(100% - 32px);cursor:pointer}

  .overlay{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;display:none}
  .overlay.open{display:block}
  .overlay-inner{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px))}
  .back-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 14px;font-size:13px;font-family:inherit;cursor:pointer;margin-bottom:18px}
  .step{display:flex;gap:12px;margin-bottom:20px}
  .step-num{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
  .step-body p{margin:3px 0 0;font-size:14.5px;line-height:1.55}
  .step-form{border:1px dashed var(--border);border-radius:10px;padding:12px;margin-top:12px;position:relative}
  .step-form .rm{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--text-dim);font-size:18px;cursor:pointer}
  .add-step-btn{width:100%;margin-top:12px;padding:11px;border-radius:9px;border:1px dashed var(--border);background:none;color:var(--text-dim);font-size:13.5px;font-family:inherit;cursor:pointer}
  .sheet-actions{display:flex;gap:10px;margin-top:20px}
  .btn-cancel{flex:1;background:var(--surface);color:var(--text-dim);padding:12px;border-radius:9px;border:none;font-weight:700;cursor:pointer;font-family:inherit}
  .btn-save{flex:1}
  textarea{resize:vertical;min-height:60px}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="box">
    <div class="badge">GRUPO ALARD</div>
    <h1>Entrar</h1>
    <div class="sub">Wiki de Procedimentos</div>
    <label>E-mail</label>
    <input id="email" type="email" placeholder="seu@email.com" autocomplete="username">
    <label>Senha</label>
    <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
    <button class="btn" id="loginBtn" style="width:100%;margin-top:22px">Entrar</button>
    <div class="msg" id="loginMsg"></div>
  </div>
</div>

<div id="appScreen">
  <header>
    <div class="top-row">
      <div class="who"><span class="dot" id="whoDot"></span><span id="whoName"></span></div>
      <button class="logout-link" id="logoutBtn">Sair</button>
    </div>
    <div class="badge">WIKI</div>
    <h1 style="font-size:22px">Procedimentos</h1>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="Buscar procedimento...">
    </div>
    <div class="tags" id="tags"></div>
  </header>
  <main id="list"><div class="loading">Carregando...</div></main>
  <button class="fab" id="openNew">+ Novo procedimento</button>
</div>

<div class="overlay" id="viewOverlay"><div class="overlay-inner" id="viewContent"></div></div>

<div class="overlay" id="formOverlay">
  <div class="overlay-inner">
    <button class="back-btn" id="cancelForm">← Cancelar</button>
    <h1 style="font-size:22px">Novo procedimento</h1>
    <label>Categoria</label>
    <select id="pCat">
      <option>Central de Alarme</option>
      <option>CFTV</option>
      <option>Cerca Elétrica</option>
      <option>Rede / Internet</option>
      <option>Outro</option>
    </select>
    <label>Título</label>
    <input id="pTitle" type="text" placeholder="Ex: Configurar central de alarme JFL">
    <div id="stepsContainer"></div>
    <button class="add-step-btn" id="addStep">+ Adicionar passo</button>
    <div class="msg" id="formMsg"></div>
    <div class="sheet-actions">
      <button class="btn-cancel" id="cancelForm2">Cancelar</button>
      <button class="btn btn-save" id="saveProc">Salvar procedimento</button>
    </div>
  </div>
</div>

<script>
  const sb = supabase.createClient(
    'https://ophydiyzvbvilhkmcwuh.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9waHlkaXl6dmJ2aWxoa21jd3VoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyOTg0OTgsImV4cCI6MjEwNTg3NDQ5OH0.roXYCaGC5E8rDQtHNH7vqYj_kqagno30roDNZsByiMc'
  );

  let currentProfile = null;
  let activeCat = null;
  let allProcs = [];

  function showMsg(el, text) { el.textContent = text; el.classList.add('error'); el.style.display = 'block'; }

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const msg = document.getElementById('loginMsg');
    if (!email || !password) { showMsg(msg, 'Preencha e-mail e senha.'); return; }
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { showMsg(msg, 'Erro: ' + error.message); return; }
    await enterApp(data.user.id);
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await sb.auth.signOut();
    document.getElementById('appScreen').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
  });

  async function enterApp(userId) {
    const { data: profile, error } = await sb.from('profiles').select('*').eq('id', userId).single();
    if (error || !profile) { showMsg(document.getElementById('loginMsg'), 'Perfil não encontrado.'); return; }
    currentProfile = profile;
    document.getElementById('whoName').textContent = profile.name;
    document.getElementById('whoDot').style.background = profile.color || '#666';
    document.getElementById('openNew').style.display = profile.role === 'admin' ? 'block' : 'none';
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appScreen').style.display = 'block';
    loadProcedures();
  }

  async function loadProcedures() {
    const listEl = document.getElementById('list');
    listEl.innerHTML = '<div class="loading">Carregando...</div>';
    const { data, error } = await sb.from('procedures').select('*, procedure_steps(*)').order('created_at', { ascending: false });
    if (error) { listEl.innerHTML = `<div class="empty">Erro ao carregar: ${error.message}</div>`; return; }
    allProcs = data || [];
    renderTags();
    renderList();
  }

  function renderTags() {
    const cats = [...new Set(allProcs.map(p => p.category))];
    document.getElementById('tags').innerHTML = ['Todos', ...cats].map(c => {
      const isActive = (c === 'Todos' && !activeCat) || c === activeCat;
      return `<button class="tag ${isActive?'active':''}" data-cat="${c==='Todos'?'':c}">${c}</button>`;
    }).join('');
    document.querySelectorAll('.tag').forEach(t => t.addEventListener('click', () => { activeCat = t.dataset.cat || null; renderTags(); renderList(); }));
  }

  function renderList() {
    const term = document.getElementById('searchInput').value.trim().toLowerCase();
    let filtered = allProcs;
    if (activeCat) filtered = filtered.filter(p => p.category === activeCat);
    if (term) filtered = filtered.filter(p => (p.title + ' ' + p.category).toLowerCase().includes(term));
    const listEl = document.getElementById('list');
    if (filtered.length === 0) { listEl.innerHTML = '<div class="empty">Nenhum procedimento encontrado.</div>'; return; }
    listEl.innerHTML = filtered.map(p => `
      <div class="card" data-id="${p.id}">
        <div class="card-cat">${p.category.toUpperCase()}</div>
        <div class="card-title">${p.title}</div>
        <div class="card-steps">${(p.procedure_steps||[]).length} passo${(p.procedure_steps||[]).length!==1?'s':''}</div>
      </div>
    `).join('');
    listEl.querySelectorAll('.card').forEach(c => c.addEventListener('click', () => openView(c.dataset.id)));
  }

  document.getElementById('searchInput').addEventListener('input', renderList);

  function openView(id) {
    const p = allProcs.find(x => x.id === id);
    const steps = (p.procedure_steps || []).sort((a,b) => a.step_order - b.step_order);
    document.getElementById('viewContent').innerHTML = `
      <button class="back-btn" id="backList">← Voltar</button>
      <div class="badge">${p.category.toUpperCase()}</div>
      <h1 style="font-size:22px">${p.title}</h1>
      ${steps.map((s,i) => `<div class="step"><div class="step-num">${i+1}</div><div class="step-body"><p>${s.text}</p></div></div>`).join('')}
    `;
    document.getElementById('viewOverlay').classList.add('open');
    document.getElementById('backList').addEventListener('click', () => document.getElementById('viewOverlay').classList.remove('open'));
  }

  const formOverlay = document.getElementById('formOverlay');
  const stepsContainer = document.getElementById('stepsContainer');

  function addStepBlock() {
    const div = document.createElement('div');
    div.className = 'step-form';
    div.innerHTML = `<button type="button" class="rm">×</button><label>Passo ${stepsContainer.children.length + 1}</label><textarea placeholder="Descreva este passo..." class="step-text"></textarea>`;
    stepsContainer.appendChild(div);
    div.querySelector('.rm').addEventListener('click', () => { div.remove(); renumberSteps(); });
  }
  function renumberSteps() {
    [...stepsContainer.children].forEach((el,i) => el.querySelector('label').textContent = 'Passo ' + (i+1));
  }

  document.getElementById('openNew').addEventListener('click', () => {
    document.getElementById('pTitle').value = '';
    document.getElementById('pCat').selectedIndex = 0;
    document.getElementById('formMsg').style.display = 'none';
    stepsContainer.innerHTML = '';
    addStepBlock();
    formOverlay.classList.add('open');
  });
  document.getElementById('addStep').addEventListener('click', addStepBlock);
  document.getElementById('cancelForm').addEventListener('click', () => formOverlay.classList.remove('open'));
  document.getElementById('cancelForm2').addEventListener('click', () => formOverlay.classList.remove('open'));

  document.getElementById('saveProc').addEventListener('click', async () => {
    const title = document.getElementById('pTitle').value.trim();
    const category = document.getElementById('pCat').value;
    const formMsg = document.getElementById('formMsg');
    const stepTexts = [...stepsContainer.children].map(d => d.querySelector('.step-text').value.trim()).filter(Boolean);
    if (!title) { showMsg(formMsg, 'Dê um título ao procedimento.'); return; }
    if (stepTexts.length === 0) { showMsg(formMsg, 'Adicione pelo menos um passo.'); return; }

    const { data: proc, error: procErr } = await sb.from('procedures')
      .insert({ title, category, created_by: currentProfile.id })
      .select().single();
    if (procErr) { showMsg(formMsg, 'Erro: ' + procErr.message); return; }

    const stepsPayload = stepTexts.map((text, i) => ({ procedure_id: proc.id, step_order: i + 1, text }));
    const { error: stepsErr } = await sb.from('procedure_steps').insert(stepsPayload);
    if (stepsErr) { showMsg(formMsg, 'Procedimento criado, mas erro nos passos: ' + stepsErr.message); return; }

    formOverlay.classList.remove('open');
    loadProcedures();
  });

  sb.auth.getSession().then(({ data }) => {
    if (data.session) enterApp(data.session.user.id);
  });
</script>
</body>
</html>
