<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda — Grupo Alard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root { --bg:#0d0d0d; --surface:#161616; --accent:#e2231a; --accent-dim:#7a1512;
    --text:#eef0ee; --text-dim:#9aa39d; --border:#2a2a2a;
    --urgente:#e2231a; --media:#f97316; --normal:#cbd5e1;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  *,*::before,*::after{box-sizing:inherit}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Poppins',-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}

  #loginScreen{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
  .box{width:100%;max-width:360px}
  .badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--accent);background:rgba(226,35,26,.1);border:1px solid var(--accent-dim);border-radius:999px;padding:5px 12px;margin-bottom:14px}
  h1{margin:0 0 6px;font-size:24px;font-weight:800}
  .sub{color:var(--text-dim);font-size:13.5px;margin-bottom:24px}
  label{display:block;font-size:12px;color:var(--text-dim);margin:14px 0 6px;font-family:'IBM Plex Mono',monospace}
  input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--text);font-size:14.5px;font-family:inherit;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  .btn{padding:13px;border-radius:9px;font-size:15px;font-weight:700;border:none;cursor:pointer;font-family:inherit;background:var(--accent);color:#fff}
  .msg{margin-top:14px;font-size:13px;padding:10px 12px;border-radius:8px;display:none}
  .msg.error{display:block;background:rgba(226,35,26,.12);color:#ff6b63;border:1px solid var(--accent-dim)}

  #appScreen{display:none;max-width:560px;margin:0 auto;min-height:100%}
  header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:20px 16px 12px;border-bottom:1px solid var(--border);z-index:5}
  .top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-dim)}
  .who .dot{width:9px;height:9px;border-radius:50%}
  .logout-link{font-size:12px;color:var(--text-dim);background:none;border:none;cursor:pointer;text-decoration:underline;font-family:inherit}
  .days{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
  .day{flex-shrink:0;text-align:center;padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;min-width:52px}
  .day.active{border-color:var(--accent);background:rgba(226,35,26,.12)}
  .day .dow{font-size:10px;color:var(--text-dim);text-transform:uppercase}
  .day .num{font-size:16px;font-weight:700}
  .day.active .num{color:var(--accent)}
  .filters{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .pill{font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--border);color:var(--text-dim);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .pill.active{color:var(--text);border-color:currentColor}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  main{padding:14px 16px 100px}
  .empty,.loading{color:var(--text-dim);text-align:center;padding:48px 20px;font-size:14px;line-height:1.6}
  .event{display:flex;gap:12px;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--who-color,var(--border));border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer}
  .event-time{flex-shrink:0;width:52px;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--text);font-weight:600;padding-top:1px}
  .event-top-row{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
  .event-title{font-size:14.5px;font-weight:700}
  .event-who{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text-dim)}
  .prio{font-size:10px;font-weight:800;letter-spacing:.02em;padding:2px 8px;border-radius:999px}
  .status-tag{font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;margin-top:8px;display:inline-block}
  .status-ok{color:#22c55e;background:rgba(34,197,94,.12)}
  .status-fwd{color:var(--text-dim);background:var(--surface)}
  .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--accent);color:#fff;border:none;border-radius:999px;padding:14px 22px;font-size:15px;font-weight:700;font-family:inherit;max-width:calc(560px - 32px);width:calc(100% - 32px);cursor:pointer}

  .sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10;display:none;align-items:flex-end;justify-content:center}
  .sheet-backdrop.open{display:flex}
  .sheet{background:var(--bg);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border);max-height:88vh;overflow-y:auto}
  .row2{display:flex;gap:10px}
  .row2>div{flex:1}
  .prio-choice{display:flex;gap:8px;margin-top:6px}
  .prio-opt{flex:1;text-align:center;padding:9px 4px;border-radius:8px;border:1px solid var(--border);font-size:12px;font-weight:700;cursor:pointer;color:var(--text-dim)}
  .del-btn{margin-top:14px;width:100%;text-align:center;font-size:12.5px;color:var(--text-dim);background:none;border:1px dashed var(--border);border-radius:8px;padding:8px;cursor:pointer;font-family:inherit}
  .sheet-actions{display:flex;gap:10px;margin-top:18px}
  .btn-cancel{flex:1;background:var(--surface);color:var(--text-dim);padding:12px;border-radius:9px;border:none;font-weight:700;cursor:pointer;font-family:inherit}
  .btn-save{flex:1}

  .confirm-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:30;display:none;align-items:center;justify-content:center;padding:20px}
  .confirm-modal.open{display:flex}
  .confirm-box{background:var(--bg);border:1px solid var(--urgente);border-radius:16px;padding:22px;max-width:380px;width:100%}
  .confirm-box .tag{color:var(--urgente);font-size:11px;font-weight:800;letter-spacing:.05em;margin-bottom:8px}
  .confirm-box h3{margin:0 0 6px;font-size:17px}
  .confirm-box p{margin:0 0 18px;font-size:13px;color:var(--text-dim)}
  .confirm-actions{display:flex;gap:10px}
  .btn-accept{flex:1;background:#22c55e;color:#0d0d0d;padding:12px;border-radius:9px;border:none;font-weight:700;cursor:pointer;font-family:inherit}
  .btn-decline{flex:1;background:var(--surface);color:var(--text);padding:12px;border-radius:9px;border:none;font-weight:700;cursor:pointer;font-family:inherit}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="box">
    <div class="badge">GRUPO ALARD</div>
    <h1>Entrar</h1>
    <div class="sub">Agenda compartilhada</div>
    <label>E-mail</label>
    <input id="email" type="email" placeholder="seu@email.com" autocomplete="username">
    <label>Senha</label>
    <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
    <button class="btn" id="loginBtn" style="width:100%;margin-top:22px">Entrar</button>
    <div class="msg" id="loginMsg"></div>
  </div>
</div>

<div id="appScreen">
  <header>
    <div class="top-row">
      <div class="who"><span class="dot" id="whoDot"></span><span id="whoName"></span></div>
      <button class="logout-link" id="logoutBtn">Sair</button>
    </div>
    <div class="badge">AGENDA</div>
    <h1 style="font-size:22px">Agenda compartilhada</h1>
    <div class="days" id="days"></div>
    <div class="filters" id="filters"></div>
  </header>
  <main id="list"><div class="loading">Carregando...</div></main>
  <button class="fab" id="openNew">+ Novo compromisso</button>
</div>

<div class="sheet-backdrop" id="backdrop">
  <div class="sheet">
    <h2 id="sheetTitle" style="font-size:16px;margin:0 0 14px">Novo compromisso</h2>
    <label>Responsável</label>
    <select id="who"></select>
    <label>Título</label>
    <input id="title" type="text" placeholder="Ex: Visita técnica - Cliente Paulo">
    <label>Cliente (opcional)</label>
    <input id="clientName" type="text" placeholder="Ex: Paulo Ferreira">
    <div class="row2">
      <div><label>Data</label><input id="date" type="date"></div>
      <div><label>Hora</label><input id="time" type="time"></div>
    </div>
    <label>Observação (opcional)</label>
    <textarea id="note" placeholder="Detalhes do compromisso..." style="min-height:60px;resize:vertical"></textarea>
    <label>Prioridade</label>
    <div class="prio-choice" id="prioChoice">
      <div class="prio-opt" data-v="normal">Normal</div>
      <div class="prio-opt" data-v="media">Média</div>
      <div class="prio-opt" data-v="urgente">Urgente</div>
    </div>
    <div class="msg" id="formMsg"></div>
    <button class="del-btn" id="delBtn" style="display:none">Excluir compromisso</button>
    <div class="sheet-actions">
      <button class="btn-cancel" id="cancel">Cancelar</button>
      <button class="btn btn-save" id="save">Salvar</button>
    </div>
  </div>
</div>

<div class="confirm-modal" id="confirmModal"><div class="confirm-box" id="confirmBox"></div></div>

<script>
  const sb = supabase.createClient(
    'https://ophydiyzvbvilhkmcwuh.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9waHlkaXl6dmJ2aWxoa21jd3VoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyOTg0OTgsImV4cCI6MjEwNTg3NDQ5OH0.roXYCaGC5E8rDQtHNH7vqYj_kqagno30roDNZsByiMc'
  );

  let currentProfile = null;
  let profiles = [];
  let allEvents = [];
  let selectedDate;
  let activeWho = null;
  let editingId = null;
  let openConfirmId = null;

  function ymd(d) { return d.toISOString().slice(0,10); }
  const today = new Date(); today.setHours(0,0,0,0);
  selectedDate = ymd(today);

  const prioHex = { urgente:'#e2231a', media:'#f97316', normal:'#cbd5e1' };
  const prioLabel = { urgente:'URGENTE', media:'MÉDIA', normal:'NORMAL' };

  function showMsg(el, text) { el.textContent = text; el.classList.add('error'); el.style.display = 'block'; }

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const msg = document.getElementById('loginMsg');
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { showMsg(msg, 'Erro: ' + error.message); return; }
    await enterApp(data.user.id);
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await sb.auth.signOut();
    document.getElementById('appScreen').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
  });

  async function enterApp(userId) {
    const { data: profile, error } = await sb.from('profiles').select('*').eq('id', userId).single();
    if (error || !profile) { showMsg(document.getElementById('loginMsg'), 'Perfil não encontrado.'); return; }
    currentProfile = profile;
    document.getElementById('whoName').textContent = profile.name;
    document.getElementById('whoDot').style.background = profile.color || '#666';
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appScreen').style.display = 'block';

    const { data: allProfiles } = await sb.from('profiles').select('*');
    profiles = allProfiles || [];
    document.getElementById('who').innerHTML = profiles.map(p => `<option value="${p.id}">${p.name}</option>`).join('');

    renderDays();
    renderFilters();
    await loadEvents();

    if ('Notification' in window && Notification.permission === 'default') {
      document.addEventListener('click', function askOnce() { Notification.requestPermission(); document.removeEventListener('click', askOnce); }, { once: true });
    }
    setInterval(checkReminders, 20000);
  }

  function profileById(id) { return profiles.find(p => p.id === id) || {}; }

  function renderDays() {
    const daysEl = document.getElementById('days');
    const dow = ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
    let html = '';
    for (let i = 0; i < 7; i++) {
      const d = new Date(today.getTime() + i*86400000);
      const iso = ymd(d);
      html += `<div class="day ${iso===selectedDate?'active':''}" data-date="${iso}"><div class="dow">${dow[d.getDay()]}</div><div class="num">${d.getDate()}</div></div>`;
    }
    daysEl.innerHTML = html;
    daysEl.querySelectorAll('.day').forEach(el => el.addEventListener('click', () => { selectedDate = el.dataset.date; renderDays(); renderList(); }));
  }

  function renderFilters() {
    document.getElementById('filters').innerHTML = ['Todos', ...profiles.map(p=>p.name)].map(name => {
      const active = (name==='Todos' && !activeWho) || name===activeWho;
      const p = profiles.find(x=>x.name===name);
      const dot = p ? `<span class="dot" style="background:${p.color}"></span>` : '';
      return `<button class="pill ${active?'active':''}" data-who="${name==='Todos'?'':name}">${dot}${name}</button>`;
    }).join('');
    document.querySelectorAll('.pill').forEach(p => p.addEventListener('click', () => { activeWho = p.dataset.who || null; renderFilters(); renderList(); }));
  }

  async function loadEvents() {
    const listEl = document.getElementById('list');
    listEl.innerHTML = '<div class="loading">Carregando...</div>';
    const weekEnd = ymd(new Date(today.getTime() + 7*86400000));
    const { data, error } = await sb.from('events').select('*').gte('date', ymd(today)).lte('date', weekEnd).order('time');
    if (error) { listEl.innerHTML = `<div class="empty">Erro: ${error.message}</div>`; return; }
    allEvents = data || [];
    renderList();
  }

  function renderList() {
    let filtered = allEvents.filter(e => e.date === selectedDate);
    if (activeWho) { const p = profiles.find(x=>x.name===activeWho); filtered = filtered.filter(e => e.who === p?.id); }
    filtered.sort((a,b) => a.time.localeCompare(b.time));
    const listEl = document.getElementById('list');
    if (filtered.length === 0) { listEl.innerHTML = '<div class="empty">Nada agendado para este dia.</div>'; return; }
    listEl.innerHTML = filtered.map(e => {
      const p = profileById(e.who);
      return `
      <div class="event" style="--who-color:${p.color||'#666'}" data-id="${e.id}">
        <div class="event-time">${e.time.slice(0,5)}</div>
        <div style="flex:1">
          <div class="event-top-row">
            <span class="event-title">${e.title}</span>
            <span class="prio" style="background:${prioHex[e.priority]}22;color:${prioHex[e.priority]}">${prioLabel[e.priority]}</span>
          </div>
          <span class="event-who"><span class="dot" style="background:${p.color||'#666'}"></span>${p.name||'?'}</span>
          ${e.note ? `<div style="font-size:13px;color:var(--text-dim);margin-top:4px">${e.note}</div>` : ''}
          ${renderStatusUI(e)}
        </div>
      </div>`;
    }).join('');
    listEl.querySelectorAll('.event').forEach(c => c.addEventListener('click', (ev) => {
      if (ev.target.closest('.confirm-btn')) return;
      openEdit(c.dataset.id);
    }));
    listEl.querySelectorAll('.confirm-btn').forEach(b => b.addEventListener('click', (ev) => { ev.stopPropagation(); openConfirmModal(b.dataset.id); }));
  }

  function renderStatusUI(e) {
    if (e.status === 'encaminhado') return `<span class="status-tag status-fwd">ENCAMINHADO${e.forward_reason ? ' — ' + e.forward_reason : ''}</span>`;
    if (e.status === 'confirmado') return `<span class="status-tag status-ok">✓ CONFIRMADO</span>`;
    if (e.priority === 'normal') return '';
    return `<button class="confirm-btn" data-id="${e.id}" style="margin-top:8px;font-size:12px;font-weight:700;padding:6px 12px;border-radius:7px;border:1px solid var(--urgente);color:var(--urgente);background:rgba(226,35,26,.1);cursor:pointer;font-family:inherit">Confirmar presença</button>`;
  }

  const backdrop = document.getElementById('backdrop');
  const prioChoice = document.getElementById('prioChoice');
  prioChoice.querySelectorAll('.prio-opt').forEach(opt => opt.addEventListener('click', () => selectPrio(opt.dataset.v)));

  function selectPrio(v) {
    prioChoice.querySelectorAll('.prio-opt').forEach(o => {
      const sel = o.dataset.v === v;
      o.style.background = sel ? prioHex[o.dataset.v] : 'var(--surface)';
      o.style.color = sel ? '#0d0d0d' : 'var(--text-dim)';
      o.style.borderColor = sel ? 'transparent' : 'var(--border)';
    });
    prioChoice.dataset.value = v;
  }

  document.getElementById('openNew').addEventListener('click', () => {
    editingId = null;
    document.getElementById('sheetTitle').textContent = 'Novo compromisso';
    document.getElementById('delBtn').style.display = 'none';
    document.getElementById('formMsg').style.display = 'none';
    document.getElementById('who').value = currentProfile.id;
    document.getElementById('title').value = '';
    document.getElementById('clientName').value = '';
    document.getElementById('note').value = '';
    document.getElementById('date').value = selectedDate;
    document.getElementById('time').value = '';
    selectPrio('normal');
    backdrop.classList.add('open');
  });

  function openEdit(id) {
    const e = allEvents.find(x => x.id === id);
    editingId = id;
    document.getElementById('sheetTitle').textContent = 'Editar compromisso';
    document.getElementById('delBtn').style.display = 'block';
    document.getElementById('formMsg').style.display = 'none';
    document.getElementById('who').value = e.who;
    document.getElementById('title').value = e.title;
    document.getElementById('clientName').value = e.client_name || '';
    document.getElementById('note').value = e.note || '';
    document.getElementById('date').value = e.date;
    document.getElementById('time').value = e.time.slice(0,5);
    selectPrio(e.priority);
    backdrop.classList.add('open');
  }

  document.getElementById('cancel').addEventListener('click', () => backdrop.classList.remove('open'));
  backdrop.addEventListener('click', e => { if (e.target === backdrop) backdrop.classList.remove('open'); });

  document.getElementById('delBtn').addEventListener('click', async () => {
    await sb.from('events').delete().eq('id', editingId);
    backdrop.classList.remove('open');
    loadEvents();
  });

  document.getElementById('save').addEventListener('click', async () => {
    const title = document.getElementById('title').value.trim();
    const date = document.getElementById('date').value;
    const time = document.getElementById('time').value;
    const formMsg = document.getElementById('formMsg');
    if (!title || !date || !time) { showMsg(formMsg, 'Preencha título, data e hora.'); return; }
    const payload = {
      who: document.getElementById('who').value,
      title, date, time,
      client_name: document.getElementById('clientName').value.trim() || null,
      note: document.getElementById('note').value.trim() || null,
      priority: prioChoice.dataset.value || 'normal'
    };
    if (editingId) {
      const { error } = await sb.from('events').update(payload).eq('id', editingId);
      if (error) { showMsg(formMsg, 'Erro: ' + error.message); return; }
    } else {
      const { error } = await sb.from('events').insert(payload);
      if (error) { showMsg(formMsg, 'Erro: ' + error.message); return; }
    }
    backdrop.classList.remove('open');
    selectedDate = date;
    renderDays();
    loadEvents();
  });

  // --- Confirmação e lembretes ---
  function notify(e) {
    if ('Notification' in window && Notification.permission === 'granted') {
      try { new Notification('Confirme sua presença', { body: `${e.title} às ${e.time.slice(0,5)} — ${prioLabel[e.priority]}` }); } catch(err) {}
    }
  }

  const confirmModal = document.getElementById('confirmModal');
  const confirmBox = document.getElementById('confirmBox');

  function openConfirmModal(id) {
    const e = allEvents.find(x => x.id === id);
    if (!e || e.status !== 'pendente') return;
    openConfirmId = id;
    const p = profileById(e.who);
    confirmBox.innerHTML = `
      <div class="tag">CONFIRMAÇÃO NECESSÁRIA</div>
      <h3>${e.title}</h3>
      <p>Hoje às ${e.time.slice(0,5)} · responsável: ${p.name||''}</p>
      <div class="confirm-actions">
        <button class="btn-decline" id="btnDecline">Não vou conseguir</button>
        <button class="btn-accept" id="btnAccept">Aceitar</button>
      </div>`;
    confirmModal.classList.add('open');
    document.getElementById('btnAccept').addEventListener('click', async () => {
      await sb.from('events').update({ status: 'confirmado' }).eq('id', e.id);
      confirmModal.classList.remove('open'); openConfirmId = null; loadEvents();
    });
    document.getElementById('btnDecline').addEventListener('click', () => showForwardStep(e));
  }

  function showForwardStep(e) {
    confirmBox.innerHTML = `
      <div class="tag">ENCAMINHAR REAGENDAMENTO</div>
      <h3>${e.title}</h3>
      <p>Isso avisa a Moça da Agenda para reagendar este atendimento.</p>
      <label style="margin:0 0 6px">Motivo (opcional)</label>
      <textarea id="fwdReason" style="min-height:60px" placeholder="Ex: sem tempo hábil..."></textarea>
      <div class="confirm-actions" style="margin-top:14px">
        <button class="btn-decline" id="btnBack">Voltar</button>
        <button class="btn-accept" id="btnForward" style="background:var(--accent);color:#fff">Encaminhar</button>
      </div>`;
    document.getElementById('btnBack').addEventListener('click', () => openConfirmModal(e.id));
    document.getElementById('btnForward').addEventListener('click', async () => {
      const reason = document.getElementById('fwdReason').value.trim();
      const agenda = profiles.find(x => x.role === 'agenda');
      const origName = profileById(e.who).name || '';
      const payload = { status: 'encaminhado', forward_reason: (reason ? reason + ' — ' : '') + `originalmente com ${origName}` };
      if (agenda) payload.who = agenda.id;
      await sb.from('events').update(payload).eq('id', e.id);
      confirmModal.classList.remove('open'); openConfirmId = null; loadEvents();
    });
  }

  async function checkReminders() {
    const now = Date.now();
    for (const e of allEvents) {
      if (e.status !== 'pendente') continue;
      const eventTime = new Date(e.date + 'T' + e.time).getTime();

      if (e.priority === 'urgente') {
        const first = eventTime - 60*60000;
        if (now >= first) {
          if (!e._next || now >= e._next) {
            notify(e);
            if (!confirmModal.classList.contains('open')) openConfirmModal(e.id);
            e._next = (e._next || first) + 15*60000;
          }
        }
      } else if (e.priority === 'media') {
        const first = eventTime - 60*60000;
        const deadline = eventTime - 30*60000;
        if (now >= first && !e._notified) { notify(e); e._notified = true; }
        if (now >= deadline) {
          const agenda = profiles.find(x => x.role === 'agenda');
          const payload = { status: 'encaminhado', forward_reason: `Não confirmado a tempo (automático) — originalmente com ${profileById(e.who).name||''}` };
          if (agenda) payload.who = agenda.id;
          await sb.from('events').update(payload).eq('id', e.id);
          loadEvents();
        }
      } else if (e.priority === 'normal') {
        const first = eventTime - 30*60000;
        if (now >= first && !e._notified) { notify(e); e._notified = true; }
        if (now >= eventTime) {
          const agenda = profiles.find(x => x.role === 'agenda');
          const payload = { status: 'encaminhado', forward_reason: `Não confirmado a tempo (automático) — originalmente com ${profileById(e.who).name||''}` };
          if (agenda) payload.who = agenda.id;
          await sb.from('events').update(payload).eq('id', e.id);
          loadEvents();
        }
      }
    }
  }

  sb.auth.getSession().then(({ data }) => {
    if (data.session) enterApp(data.session.user.id);
  });
</script>
