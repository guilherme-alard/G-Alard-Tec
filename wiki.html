<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wiki — Grupo Alard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  /* Layout: coluna única de app (560px), cabeçalho fixo com busca e chips de categoria; guias abrem em tela cheia. Identidade Grupo Alard: escuro + vermelho. */
  :root {
    --bg: #0d0d0d; --surface: #161616; --surface-2: #1f1f1f;
    --accent: #e2231a; --accent-dim: #7a1512; --accent-soft: rgba(226,35,26,0.1);
    --text: #eef0ee; --text-dim: #9aa39d; --border: #2a2a2a; --paper: #ffffff;
    --f-display: 'Poppins', -apple-system, 'Segoe UI', sans-serif;
    --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--f-display); -webkit-font-smoothing: antialiased; }
  .app { max-width: 560px; margin: 0 auto; min-height: 100%; }

  header { position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); padding: 20px 16px 12px; border-bottom: 1px solid var(--border); z-index: 5; }
  .brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .brand img { height: 40px; width: auto; }
  .brand .badge { margin-bottom: 0; }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: var(--accent); background: var(--accent-soft); border: 1px solid var(--accent-dim); border-radius: 999px; padding: 5px 12px; margin-bottom: 12px; }
  h1 { margin: 0 0 14px; font-size: 24px; font-weight: 800; text-wrap: balance; }
  .head-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .count { font-family: var(--f-mono); font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; color: var(--text-dim); }
  .search input[type=text] { flex: 1; min-width: 0; background: none; border: none; padding: 0; outline: none; color: var(--text); font-size: 15px; font-family: inherit; }
  .search input::placeholder { color: var(--text-dim); }
  .tags { display: flex; gap: 8px; margin-top: 12px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .tags::-webkit-scrollbar { display: none; }
  .tag { flex-shrink: 0; font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); color: var(--text-dim); background: var(--surface); cursor: pointer; white-space: nowrap; font-family: inherit; }
  .tag.active { color: var(--accent); border-color: var(--accent-dim); background: var(--accent-soft); }

  main { padding: 12px 16px 100px; }
  .empty { color: var(--text-dim); text-align: center; padding: 48px 20px; font-size: 14px; line-height: 1.6; }
  .group-title { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.06em; color: var(--text-dim); margin: 18px 2px 8px; text-transform: uppercase; display: flex; justify-content: space-between; }
  .group-title:first-child { margin-top: 4px; }

  .card { width: 100%; text-align: left; font-family: inherit; color: inherit; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 8px; cursor: pointer; display: flex; gap: 14px; align-items: flex-start; }
  .card:active, .card:hover { border-color: var(--accent-dim); }
  .card-num { flex-shrink: 0; width: 40px; height: 40px; border-radius: 10px; background: var(--accent-soft); border: 1px solid var(--accent-dim); color: var(--accent); font-family: var(--f-mono); font-size: 13px; display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
  .card-num.own { background: var(--surface-2); border-color: var(--border); color: var(--text-dim); }
  .card-body { min-width: 0; }
  .card-cat { font-size: 10.5px; font-weight: 700; letter-spacing: 0.05em; color: var(--accent); margin-bottom: 3px; font-family: var(--f-mono); text-transform: uppercase; }
  .card-title { font-size: 15.5px; font-weight: 700; margin-bottom: 3px; line-height: 1.3; }
  .card-steps { font-size: 12.5px; color: var(--text-dim); line-height: 1.45; }

  .fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--accent); color: #fff; border: none; border-radius: 999px; padding: 14px 22px; font-size: 15px; font-weight: 700; font-family: inherit; display: flex; align-items: center; gap: 8px; box-shadow: 0 6px 20px rgba(0,0,0,0.5); max-width: calc(560px - 32px); width: calc(100% - 32px); justify-content: center; cursor: pointer; z-index: 6; }
  .fab:active { background: #b81c14; }

  .overlay { position: fixed; inset: 0; background: var(--bg); z-index: 20; overflow-y: auto; display: none; }
  .overlay.open { display: block; }
  .overlay-inner { max-width: 560px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(40px + env(safe-area-inset-bottom, 0px)); }
  .overlay-inner.wide { max-width: 900px; }
  .back-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 8px 14px; font-size: 13px; font-family: inherit; cursor: pointer; }
  .view-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 18px; }
  .sub { color: var(--text-dim); font-size: 14.5px; line-height: 1.55; margin: -6px 0 16px; }
  .sheet { background: var(--paper); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
  .sheet img { display: block; width: 100%; height: auto; }
  .sheet.zoom { overflow-x: auto; }
  .sheet.zoom img { width: 200%; max-width: none; }
  .tools { display: flex; gap: 8px; margin: 12px 0 0; }
  .tools button { flex: 1; }
  .nav { display: flex; gap: 10px; margin-top: 16px; }
  .nav button { flex: 1; min-width: 0; text-align: left; background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 10px 12px; font-family: inherit; cursor: pointer; }
  .nav button.next { text-align: right; }
  .nav small { display: block; font-family: var(--f-mono); font-size: 10.5px; color: var(--text-dim); margin-bottom: 2px; }
  .nav span { display: block; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav button:disabled { visibility: hidden; }

  .step { display: flex; gap: 12px; margin-bottom: 20px; }
  .step-num { flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; }
  .step-body { min-width: 0; }
  .step-body p { margin: 3px 0 8px; font-size: 14.5px; line-height: 1.55; }
  .step-body img { max-width: 100%; border-radius: 8px; display: block; }

  label { display: block; font-size: 12px; color: var(--text-dim); margin: 14px 0 6px; font-family: var(--f-mono); }
  select, textarea, input[type=text] { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; color: var(--text); font-size: 14.5px; font-family: inherit; outline: none; }
  select:focus, textarea:focus, input[type=text]:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 60px; line-height: 1.5; }
  .step-form { border: 1px dashed var(--border); border-radius: 10px; padding: 12px; margin-top: 12px; position: relative; }
  .step-form .rm { position: absolute; top: 8px; right: 8px; background: none; border: none; color: var(--text-dim); font-size: 18px; cursor: pointer; }
  .photo-row { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  .photo-btn { background: var(--surface); border: 1px dashed var(--border); border-radius: 8px; padding: 9px 14px; color: var(--text-dim); font-size: 13px; cursor: pointer; font-family: inherit; }
  .photo-preview { height: 36px; border-radius: 6px; display: none; }
  .add-step-btn { width: 100%; margin-top: 12px; padding: 11px; border-radius: 9px; border: 1px dashed var(--border); background: none; color: var(--text-dim); font-size: 13.5px; font-family: inherit; cursor: pointer; }
  .sheet-actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn { flex: 1; padding: 12px; border-radius: 9px; font-size: 14.5px; font-weight: 700; border: none; cursor: pointer; font-family: inherit; }
  .btn-cancel { background: var(--surface); color: var(--text-dim); border: 1px solid var(--border); }
  .btn-save { background: var(--accent); color: #fff; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  #loginScreen { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .box { width: 100%; max-width: 360px; }
  .box .brand-login { height: 56px; width: auto; display: block; margin-bottom: 22px; }
  .login-sub { color: var(--text-dim); font-size: 13.5px; margin: -8px 0 20px; }
  #loginScreen input { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px; color: var(--text); font-size: 14.5px; font-family: inherit; outline: none; }
  #loginScreen input:focus { border-color: var(--accent); }
  .msg { margin-top: 14px; font-size: 13px; padding: 10px 12px; border-radius: 8px; display: none; }
  .msg.error { display: block; background: rgba(226,35,26,.12); color: #ff6b63; border: 1px solid var(--accent-dim); }
  #appScreen { display: none; }
  .who-row { display: flex; justify-content: space-between; align-items: center; margin: -4px 0 10px; font-size: 13px; color: var(--text-dim); }
  .who { display: flex; align-items: center; gap: 8px; }
  .who .dot { width: 9px; height: 9px; border-radius: 50%; }
  .logout-link { font-size: 12px; color: var(--text-dim); background: none; border: none; cursor: pointer; text-decoration: underline; font-family: inherit; }
  .home-link { color: var(--text-dim); font-size: 12px; text-decoration: none; }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="box">
    <img class="brand-login" src="logo.png" alt="Grupo Alard — Segurança Eletrônica">
    <h1>Entrar</h1>
    <div class="login-sub">Wiki de Procedimentos</div>
    <label for="email">E-mail</label>
    <input id="email" type="email" placeholder="seu@email.com" autocomplete="username">
    <label for="password">Senha</label>
    <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
    <button class="btn btn-save" id="loginBtn" style="width:100%;margin-top:22px">Entrar</button>
    <div class="msg" id="loginMsg"></div>
  </div>
</div>

<div id="appScreen">
<div class="app">
  <header>
    <div class="brand"><a href="index.html"><img src="logo.png" alt="Grupo Alard — Segurança Eletrônica" width="720" height="228"></a><div class="badge">WIKI</div></div>
    <div class="who-row">
      <div class="who"><span class="dot" id="whoDot"></span><span id="whoName"></span></div>
      <button class="logout-link" id="logoutBtn">Sair</button>
    </div>
    <div class="head-row"><h1>Procedimentos</h1><span class="count" id="count"></span></div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="Buscar: PoE, sensor PIR, sem imagem..." aria-label="Buscar procedimento">
    </div>
    <div class="tags" id="tags"></div>
  </header>
  <main id="list"><div class="empty">Carregando...</div></main>
  <button class="fab" id="openNew" style="display:none">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    Novo procedimento
  </button>
</div>
</div>

<div class="overlay" id="viewOverlay"><div class="overlay-inner" id="viewContent"></div></div>

<div class="overlay" id="formOverlay">
  <div class="overlay-inner">
    <div class="view-top"><button class="back-btn" id="cancelForm">← Cancelar</button></div>
    <h1>Novo procedimento</h1>
    <label for="pCat">Categoria</label>
    <select id="pCat">
      <option>Central de Alarme</option>
      <option>CFTV</option>
      <option>Cerca Elétrica</option>
      <option>Rede / Internet</option>
      <option>Outro</option>
    </select>
    <label for="pTitle">Título</label>
    <input id="pTitle" type="text" placeholder="Ex: Configurar central de alarme JFL">
    <div id="stepsContainer"></div>
    <button class="add-step-btn" id="addStep">+ Adicionar passo</button>
    <div class="msg" id="formMsg"></div>
    <div class="sheet-actions">
      <button class="btn btn-cancel" id="cancelForm2">Cancelar</button>
      <button class="btn btn-save" id="saveProc">Salvar procedimento</button>
    </div>
  </div>
</div>

<script>
  const sb = supabase.createClient(
    'https://ophydiyzvbvilhkmcwuh.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9waHlkaXl6dmJ2aWxoa21jd3VoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyOTg0OTgsImV4cCI6MjEwNTg3NDQ5OH0.roXYCaGC5E8rDQtHNH7vqYj_kqagno30roDNZsByiMc'
  );

  let currentProfile = null, activeCat = null, allProcs = [], GUIAS = [], CATS = [], currentList = [];
  const listEl = document.getElementById('list');
  const tagsEl = document.getElementById('tags');
  const searchInput = document.getElementById('searchInput');
  const viewOverlay = document.getElementById('viewOverlay');
  const viewContent = document.getElementById('viewContent');
  const formOverlay = document.getElementById('formOverlay');
  const stepsContainer = document.getElementById('stepsContainer');

  const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const pad = n => String(n).padStart(3, '0');
  function showMsg(el, text) { el.textContent = text; el.className = 'msg error'; }

  // Guias carregam uma vez (arquivos estáticos do projeto)
  const guiasReady = fetch('guias.json').then(r => r.json()).then(d => { GUIAS = d.g; CATS = d.cats; }).catch(() => {});

  // ---------- Login ----------
  document.getElementById('loginBtn').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const msg = document.getElementById('loginMsg');
    if (!email || !password) { showMsg(msg, 'Preencha e-mail e senha.'); return; }
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { showMsg(msg, 'Erro: ' + error.message); return; }
    await enterApp(data.user.id);
  });
  document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('loginBtn').click(); });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await sb.auth.signOut();
    document.getElementById('appScreen').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
  });

  async function enterApp(userId) {
    const { data: profile, error } = await sb.from('profiles').select('*').eq('id', userId).single();
    if (error || !profile) { showMsg(document.getElementById('loginMsg'), 'Perfil não encontrado.'); return; }
    currentProfile = profile;
    document.getElementById('whoName').textContent = profile.name;
    document.getElementById('whoDot').style.background = profile.color || '#666';
    document.getElementById('openNew').style.display = profile.role === 'admin' ? 'flex' : 'none';
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appScreen').style.display = 'block';
    try { activeCat = sessionStorage.getItem('wiki-cat') || null; } catch (e) {}
    await guiasReady;
    loadProcedures();
  }

  async function loadProcedures() {
    listEl.innerHTML = '<div class="empty">Carregando...</div>';
    const { data, error } = await sb.from('procedures').select('*, procedure_steps(*)').order('created_at', { ascending: false });
    allProcs = error ? [] : (data || []);
    renderTags(); renderList();
    if (error) listEl.insertAdjacentHTML('afterbegin', `<div class="empty">Não foi possível carregar os procedimentos da equipe: ${esc(error.message)}</div>`);
  }

  // ---------- Lista ----------
  function allItems() {
    const own = allProcs.map(p => {
      const steps = (p.procedure_steps || []).slice().sort((a, b) => a.step_order - b.step_order);
      return { kind: 'p', key: 'p' + p.id, cat: p.category, title: p.title, p, steps,
        sub: steps.length + ' passo' + (steps.length !== 1 ? 's' : ''),
        hay: norm(p.title + ' ' + p.category + ' ' + steps.map(s => s.text).join(' ')) };
    });
    const g = GUIAS.map(x => ({ kind: 'g', key: 'g' + x.n, cat: CATS[x.c], title: x.t, sub: x.s, n: x.n,
      hay: norm(x.t + ' ' + x.s + ' ' + CATS[x.c]) + ' ' + x.k }));
    return [...own, ...g];
  }

  function renderTags() {
    const cats = [...new Set([...allProcs.map(p => p.category), ...CATS])];
    tagsEl.innerHTML = ['Todos', ...cats].map(c => {
      const isActive = (c === 'Todos' && !activeCat) || c === activeCat;
      return `<button class="tag ${isActive ? 'active' : ''}" data-cat="${c === 'Todos' ? '' : esc(c)}">${esc(c)}</button>`;
    }).join('');
    tagsEl.querySelectorAll('.tag').forEach(t => t.addEventListener('click', () => {
      activeCat = t.dataset.cat || null;
      try { sessionStorage.setItem('wiki-cat', activeCat || ''); } catch (e) {}
      renderTags(); renderList(); window.scrollTo(0, 0);
    }));
  }

  function renderList() {
    const terms = norm(searchInput.value.trim()).split(/\s+/).filter(Boolean);
    let items = allItems();
    if (activeCat) items = items.filter(i => i.cat === activeCat);
    if (terms.length) items = items.filter(i => terms.every(t => i.hay.includes(t)));
    currentList = items;
    document.getElementById('count').textContent = items.length + ' de ' + (GUIAS.length + allProcs.length);
    if (!items.length) { listEl.innerHTML = '<div class="empty">Nenhum procedimento encontrado.<br>Tente outra palavra, como "HD", "PoE" ou "zona".</div>'; return; }
    let html = '', last = null;
    const grouped = !terms.length;
    items.forEach(i => {
      if (grouped && i.cat !== last) {
        const n = items.filter(x => x.cat === i.cat).length;
        html += `<div class="group-title"><span>${esc(i.cat)}</span><span>${n}</span></div>`; last = i.cat;
      }
      html += `<button class="card" data-key="${i.key}">
        <div class="card-num ${i.kind === 'p' ? 'own' : ''}">${i.kind === 'g' ? pad(i.n) : '★'}</div>
        <div class="card-body">
          ${grouped ? '' : `<div class="card-cat">${esc(i.cat)}</div>`}
          <div class="card-title">${esc(i.title)}</div>
          <div class="card-steps">${esc(i.sub)}</div>
        </div></button>`;
    });
    listEl.innerHTML = html;
    listEl.querySelectorAll('.card').forEach(c => c.addEventListener('click', () => openItem(c.dataset.key)));
  }
  searchInput.addEventListener('input', renderList);

  // ---------- Visualização ----------
  function openItem(key) {
    const idx = currentList.findIndex(i => i.key === key);
    const it = currentList[idx];
    if (!it) return;
    const prev = currentList[idx - 1], next = currentList[idx + 1];
    const navHtml = `<div class="nav">
      <button class="prev" ${prev ? `data-key="${prev.key}"` : 'disabled'}><small>← ANTERIOR</small><span>${prev ? esc(prev.title) : ''}</span></button>
      <button class="next" ${next ? `data-key="${next.key}"` : 'disabled'}><small>PRÓXIMO →</small><span>${next ? esc(next.title) : ''}</span></button></div>`;
    let body;
    if (it.kind === 'g') {
      viewContent.classList.add('wide');
      body = `<div class="badge">GUIA ${pad(it.n)} · ${esc(it.cat.toUpperCase())}</div>
        <h1>${esc(it.title)}</h1><p class="sub">${esc(it.sub)}</p>
        <div class="sheet" id="sheet"><img src="guias/${pad(it.n)}.webp" alt="Guia visual: ${esc(it.title)}" width="1000" height="1413"></div>
        <div class="tools"><button class="back-btn" id="zoomBtn">Ampliar imagem</button></div>`;
    } else {
      viewContent.classList.remove('wide');
      body = `<div class="badge">${esc(it.cat.toUpperCase())}</div><h1>${esc(it.title)}</h1>
        ${it.steps.map((s, i) => `<div class="step"><div class="step-num">${i + 1}</div><div class="step-body"><p>${esc(s.text)}</p></div></div>`).join('')}`;
    }
    viewContent.innerHTML = `<div class="view-top"><button class="back-btn" id="backList">← Voltar</button></div>${body}${navHtml}`;
    viewOverlay.classList.add('open'); viewOverlay.scrollTop = 0;
    document.getElementById('backList').addEventListener('click', () => viewOverlay.classList.remove('open'));
    const zb = document.getElementById('zoomBtn');
    if (zb) zb.addEventListener('click', () => {
      const sh = document.getElementById('sheet'); sh.classList.toggle('zoom');
      zb.textContent = sh.classList.contains('zoom') ? 'Reduzir imagem' : 'Ampliar imagem';
    });
    viewContent.querySelectorAll('.nav button[data-key]').forEach(b => b.addEventListener('click', () => openItem(b.dataset.key)));
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { viewOverlay.classList.remove('open'); formOverlay.classList.remove('open'); } });

  // ---------- Novo procedimento (admin, salva no Supabase) ----------
  function addStepBlock() {
    const div = document.createElement('div');
    div.className = 'step-form';
    div.innerHTML = `<button type="button" class="rm" aria-label="Remover passo">×</button><label>Passo ${stepsContainer.children.length + 1}</label><textarea placeholder="Descreva este passo..." class="step-text"></textarea>`;
    stepsContainer.appendChild(div);
    div.querySelector('.rm').addEventListener('click', () => { div.remove(); renumberSteps(); });
  }
  function renumberSteps() { [...stepsContainer.children].forEach((el, i) => el.querySelector('label').textContent = 'Passo ' + (i + 1)); }

  document.getElementById('openNew').addEventListener('click', () => {
    document.getElementById('pTitle').value = '';
    document.getElementById('pCat').selectedIndex = 0;
    document.getElementById('formMsg').className = 'msg';
    stepsContainer.innerHTML = '';
    addStepBlock();
    formOverlay.classList.add('open');
  });
  document.getElementById('addStep').addEventListener('click', addStepBlock);
  document.getElementById('cancelForm').addEventListener('click', () => formOverlay.classList.remove('open'));
  document.getElementById('cancelForm2').addEventListener('click', () => formOverlay.classList.remove('open'));

  document.getElementById('saveProc').addEventListener('click', async () => {
    const title = document.getElementById('pTitle').value.trim();
    const category = document.getElementById('pCat').value;
    const formMsg = document.getElementById('formMsg');
    const stepTexts = [...stepsContainer.children].map(d => d.querySelector('.step-text').value.trim()).filter(Boolean);
    if (!title) { showMsg(formMsg, 'Dê um título ao procedimento.'); return; }
    if (!stepTexts.length) { showMsg(formMsg, 'Adicione pelo menos um passo.'); return; }
    const { data: proc, error: procErr } = await sb.from('procedures').insert({ title, category, created_by: currentProfile.id }).select().single();
    if (procErr) { showMsg(formMsg, 'Erro: ' + procErr.message); return; }
    const { error: stepsErr } = await sb.from('procedure_steps').insert(stepTexts.map((text, i) => ({ procedure_id: proc.id, step_order: i + 1, text })));
    if (stepsErr) { showMsg(formMsg, 'Procedimento criado, mas houve erro nos passos: ' + stepsErr.message); return; }
    formOverlay.classList.remove('open');
    loadProcedures();
  });

  sb.auth.getSession().then(({ data }) => { if (data.session) enterApp(data.session.user.id); });
</script>
</body>
</html>
